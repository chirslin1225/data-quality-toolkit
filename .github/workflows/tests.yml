name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 and 3.10 are end-of-life and no longer available on the default
        # ubuntu-latest image, so they cannot be tested here even though the
        # code itself would still run on them.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the CLI on the bundled sample
        run: python -m dqkit examples/sample_sensor_data.csv --out /tmp/report.md
      - name: Show the report
        run: cat /tmp/report.md
